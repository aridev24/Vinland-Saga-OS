<!DOCTYPE html>
<html>
  <head>
    <style>

      body {
        width: 100%;
        height: 100%;
        background-image: url("https://images.openai.com/static-rsc-4/TvRw3W_paA49WVq3U0V5w0jUm6oj69I37aMo5mLQV3mpAqg4QP4GIkoK7DiIbV4Cdascqs_p_lFDEhOBOcKBVd9bOksUBQsdcr1mvNeEqwZ0zQfPKFARdLl9UjJ1hN2MaZtWk2W2lzuQbMDAmnwSNguK-POxWFfKMxMTm9Wuw_AuPfeNJoMN5gdYDG96_Rwb?purpose=fullsize");
        background-size: cover;
        margin: 0;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        height: auto;
        padding-bottom: 2px;
        background-color: rgb(0, 0, 0, 0.25);
        backdrop-filter: blur(50px);

        
      }

      .logo {
        margin-left: 20px;
        width: fit-content;
        font-family: Impact, sans-serif; 
        text-transform: uppercase; 
        letter-spacing: 0.8px; 
        transform: scaleY(1.3);
        color: rgb(214, 214, 214);
        font-size: 12px;
        font-weight: lighter;
        line-height: 22px;
        background-image: url("https://media.istockphoto.com/id/1391524274/vector/gray-bright-grunge-texture-vector-background.jpg?s=612x612&w=0&k=20&c=dLmXvYOICRWWTEFfgkXuM21I3IddBeOYvGt4-h1Vl1A=");
        background-size: cover;
        background-position: center;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }


      .time_element {     
        margin-right: 20px;  
        width: fit-content;
        font-family: Impact, sans-serif; 
        text-transform: uppercase; 
        letter-spacing: 0.8px; 
        transform: scaleY(1.3);
        color: rgb(214, 214, 214);
        font-size: 12px;
        font-weight: lighter;
        line-height: 22px;
        background-image: url("https://media.istockphoto.com/id/1391524274/vector/gray-bright-grunge-texture-vector-background.jpg?s=612x612&w=0&k=20&c=dLmXvYOICRWWTEFfgkXuM21I3IddBeOYvGt4-h1Vl1A=");
        background-size: cover;
        background-position: center;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      .greeting_card {
        font-family: Garamond, "Baskerville Old Face", "Times New Roman", serif;
        color: rgb(19, 19, 19);
        background-color: rgba(255, 255, 255, 0.20);        
        backdrop-filter: blur(50px);
        border : solid 1px;
        width : fit-content;
        padding: 5px;
        border-radius: 5px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%)
      }

      .map {
        font-family: Garamond, "Baskerville Old Face", "Times New Roman", serif;
        font-size: large;
        color: aliceblue;
        color: rgb(10, 10, 10);
        background-color: rgba(255, 255, 255, 0.20);        
        backdrop-filter: blur(50px);
        text-align: center;
        border: solid 1px;
        border-radius: 3px;
        position: absolute;
        top: 14%;
        left: 83%;
        line-height: 0%;
      }


      .map img {
        width: 200px;
        height: 160px;
      }

      

    </style>
  </head>
  <body>
    <div class="topbar">

      <div class="logo">
        <h1>Vinland<br>Saga OS</h1>

      </div>
      <div class="time_element">
        <h1 id="timeElement">Time </h1>
      </div>  

    </div>

    <div class="greeting_card">
      
        <h1>Good evening, warrior.<br>The sea is calm today.</h1>
      
    </div>
        <div class="map">
          <h3>
            Journey Map
          </h3>
          <img src="https://static.wixstatic.com/media/eff117_f30190b56f7f4c37abcd125a6b6f912d~mv2.jpg/v1/fill/w_800,h_600,al_c,q_85,enc_avif,quality_auto/eff117_f30190b56f7f4c37abcd125a6b6f912d~mv2.jpg">
        </div>
    </div>


    <script>
      function updateTime() {
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        timeText.innerHTML = currentTime
      }
      setInterval(updateTime, 1000);
    </script>


  </body>
</html>
